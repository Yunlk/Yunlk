name: Random Quote Updater

on:
  schedule:
    # 每天 1 次（UTC 00:00 = 北京时间 08:00）。改频率只改这一行。
    - cron: '0 0 * * *'
  workflow_dispatch:

# 与 wakatime-cache 共用同一个并发组：两个自动化任务串行执行，永不互相抢推
concurrency:
  group: readme-automation
  cancel-in-progress: false

jobs:
  update-quote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick random quote and update README
        run: |
          import random, re

          with open('quotes.txt', 'r', encoding='utf-8') as f:
              quotes = [q.strip() for q in f if q.strip()]

          if not quotes:
              print("No quotes found, exiting.")
              exit(0)

          quote = random.choice(quotes)

          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()

          new_block = f'<!-- quote-start -->\n> *"{quote}"*\n<!-- quote-end -->'
          content = re.sub(
              r'<!-- quote-start -->.*?<!-- quote-end -->',
              new_block,
              content,
              flags=re.DOTALL
          )

          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(content)

          print(f'Updated quote: {quote}')
        shell: python

      # 静默提交：如果 HEAD 已经是自动化提交，就 amend 复用同一条，
      # 历史里永远只占 1 条，不再每次运行新增提交。
      - name: Commit and push (rolling amend)
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          if git diff --cached --quiet; then
            echo "README unchanged, nothing to commit."
            exit 0
          fi

          git fetch origin "$BRANCH"
          if [ "$(git log -1 --pretty=%an)" = "github-actions[bot]" ]; then
            git commit --amend -m "🤖 auto update [skip ci]"
            git push --force-with-lease origin "HEAD:$BRANCH"
            echo "Amended the existing automation commit (no new commit added)."
          else
            git commit -m "🤖 auto update [skip ci]"
            git push origin "HEAD:$BRANCH"
            echo "Created a new automation commit on top of your latest commit."
          fi
